<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Dhahabi Market - Centro de Control</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
  
  <style>
    :root[data-theme="dark"] {
      --bg-main: #070913;
      --text-primary: #F8FAFC;
      --text-secondary: #94A3B8;
      --card-bg: rgba(13, 18, 33, 0.55);
      --card-hover: rgba(22, 30, 54, 0.8);
      --border-color: rgba(255, 255, 255, 0.12);
      --float-logo-opacity: 0.18;
    }
    :root[data-theme="light"] {
      --bg-main: #E2E8F0;
      --text-primary: #0F172A;
      --text-secondary: #475569;
      --card-bg: rgba(255, 255, 255, 0.65);
      --card-hover: rgba(255, 255, 255, 0.9);
      --border-color: rgba(0, 0, 0, 0.12);
      --float-logo-opacity: 0.22;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; -webkit-tap-highlight-color: transparent; }
    
    body {
      background: var(--bg-main);
      color: var(--text-primary);
      min-height: 100vh;
      overflow-x: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 24px 18px 40px;
      position: relative;
      transition: background 0.4s ease, color 0.4s ease;
    }

    /* Fondo de Partículas / Logos Flotantes */
    .floating-bg-container {
      position: fixed;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
      z-index: 1;
    }

    .floating-logo {
      position: absolute;
      width: 120px;
      height: auto;
      opacity: var(--float-logo-opacity);
      animation: floatAround 22s infinite ease-in-out;
      filter: drop-shadow(0 0 15px rgba(14, 165, 233, 0.4));
    }

    @keyframes floatAround {
      0% { transform: translate(0, 0) rotate(0deg) scale(1); }
      33% { transform: translate(120px, 140px) rotate(150deg) scale(1.15); }
      66% { transform: translate(-100px, 220px) rotate(270deg) scale(0.85); }
      100% { transform: translate(0, 0) rotate(360deg) scale(1); }
    }

    /* Wrapper General para Centrar Todo en Pantalla */
    .app-container {
      width: 100%;
      max-width: 1050px;
      display: flex;
      flex-direction: column;
      align-items: center;
      z-index: 10;
    }

    /* Barra Superior */
    .top-nav {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 28px;
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      padding: 12px 20px;
      border-radius: 20px;
      border: 1px solid var(--border-color);
      box-shadow: 0 10px 30px rgba(0,0,0,0.08);
      gap: 12px;
    }

    .nav-brand {
      display: flex;
      align-items: center;
      flex-shrink: 0;
    }

    .nav-brand img {
      width: 135px;
      height: auto;
      display: block;
      object-fit: contain;
    }

    .theme-switch-wrapper {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    .switch { position: relative; display: inline-block; width: 44px; height: 22px; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider { position: absolute; cursor: pointer; inset: 0; background-color: rgba(148, 163, 184, 0.4); transition: .3s; border-radius: 30px; }
    .slider:before { position: absolute; content: ""; height: 16px; width: 16px; left: 3px; bottom: 3px; background-color: #FFF; transition: .3s; border-radius: 50%; }
    input:checked + .slider { background: linear-gradient(90deg, #A855F7 0%, #0EA5E9 100%); }
    input:checked + .slider:before { transform: translateX(22px); }

    /* Titular Principal */
    .hub-header {
      text-align: center;
      margin-bottom: 32px;
    }

    .hub-header h1 {
      font-size: 36px;
      font-weight: 800;
      letter-spacing: -1px;
      margin-bottom: 8px;
      background: linear-gradient(135deg, #38BDF8 0%, #A855F7 50%, #EC4899 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 4px 15px rgba(168, 85, 247, 0.3));
    }

    .hub-header p {
      font-size: 15px;
      color: var(--text-secondary);
      font-weight: 600;
    }

    /* Grid de Accesos */
    .hub-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 24px;
      width: 100%;
      margin-bottom: 32px;
    }

    /* Tarjetas Interactivas */
    .hub-card {
      background: var(--card-bg);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid var(--border-color);
      border-radius: 24px;
      padding: 22px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      position: relative;
      overflow: hidden;
      cursor: pointer;
      transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
      text-decoration: none;
    }

    .hub-card:hover {
      transform: translateY(-6px) scale(1.015);
      background: var(--card-hover);
      border-color: rgba(56, 189, 248, 0.6);
      box-shadow: 0 0 30px rgba(14, 165, 233, 0.35), inset 0 0 15px rgba(14, 165, 233, 0.15);
    }

    .card-badge {
      position: absolute;
      top: 14px;
      right: 14px;
      background: rgba(16, 185, 129, 0.15);
      border: 1px solid rgba(16, 185, 129, 0.4);
      color: #34D399;
      font-size: 10px;
      font-weight: 800;
      padding: 4px 10px;
      border-radius: 20px;
      display: flex;
      align-items: center;
      gap: 6px;
      z-index: 2;
    }

    .pulse-dot {
      width: 6px;
      height: 6px;
      background: #34D399;
      border-radius: 50%;
      box-shadow: 0 0 8px #34D399;
      animation: pulse 1.8s infinite;
    }

    @keyframes pulse {
      0% { transform: scale(0.9); opacity: 0.7; }
      50% { transform: scale(1.3); opacity: 1; }
      100% { transform: scale(0.9); opacity: 0.7; }
    }

    .hub-card-img-box {
      width: 100%;
      height: 160px;
      border-radius: 16px;
      overflow: hidden;
      margin-top: 10px;
      margin-bottom: 16px;
      background: rgba(15, 23, 42, 0.4);
      border: 1px solid var(--border-color);
      position: relative;
    }

    .hub-card-img-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.5s ease;
    }

    .hub-card:hover .hub-card-img-box img {
      transform: scale(1.08);
    }

    .hub-card h3 {
      font-size: 19px;
      font-weight: 800;
      color: var(--text-primary);
      margin-bottom: 14px;
      letter-spacing: -0.3px;
    }

    .hub-btn {
      width: 100%;
      padding: 12px;
      border-radius: 14px;
      background: linear-gradient(135deg, #0EA5E9 0%, #6366F1 50%, #A855F7 100%);
      color: #FFF;
      font-weight: 800;
      font-size: 13px;
      letter-spacing: 0.5px;
      border: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 4px 15px rgba(14, 165, 233, 0.35);
      transition: all 0.3s ease;
    }

    .hub-card:hover .hub-btn {
      box-shadow: 0 6px 25px rgba(168, 85, 247, 0.55);
      transform: translateY(-2px);
    }

    .hub-footer {
      font-size: 12px;
      color: var(--text-secondary);
      font-weight: 600;
      margin-top: auto;
    }

    /* Adaptación Móvil */
    @media (max-width: 768px) {
      .hub-grid { grid-template-columns: 1fr; max-width: 440px; }
      .hub-header h1 { font-size: 28px; }
      .nav-brand img { width: 110px; }
      .theme-text { font-size: 11px !important; }
      .hub-card-img-box { height: 140px; }
    }
  </style>
</head>
<body>

  <!-- Fondo de Logos Flotantes -->
  <div class="floating-bg-container" id="floatingBg"></div>

  <!-- Contenedor Alineado -->
  <div class="app-container">

    <!-- Barra Superior -->
    <header class="top-nav">
      <div class="nav-brand">
        <img id="nav-logo" src="https://cdn.dhahabi.ae/logo/dhahabi-market-logo-gradient-white.svg" alt="Dhahabi Market">
      </div>
      <div class="theme-switch-wrapper">
        <span class="theme-text" style="font-size: 12px; font-weight: 700; color: var(--text-secondary);">Modo Oscuro</span>
        <label class="switch">
          <input type="checkbox" id="theme-toggle-checkbox" checked onchange="toggleTheme()">
          <span class="slider"></span>
        </label>
      </div>
    </header>

    <!-- Título Principal -->
    <div class="hub-header">
      <h1>Centro de Control</h1>
      <p>Selecciona el módulo de operaciones que deseas gestionar</p>
    </div>

    <!-- Tarjetas Interactivas -->
    <main class="hub-grid">
      
      <!-- 1. Backoffice New -->
      <a href="backoffice-new.dhahabi.ae" class="hub-card">
        <div class="card-badge"><span class="pulse-dot"></span> Activo</div>
        <div class="hub-card-img-box">
          <img src="https://cdn.dhahabi.ae/logo/dhahabi-market-logo-gradient-white.svg" alt="Backoffice New">
        </div>
        <h3>Backoffice New</h3>
        <button class="hub-btn">Acceder al Sistema <i data-lucide="arrow-right" style="width:16px;height:16px;"></i></button>
      </a>

      <!-- 2. Backoffice Last -->
      <a href="backoffice.dhahabi.ae" class="hub-card">
        <div class="card-badge"><span class="pulse-dot"></span> Activo</div>
        <div class="hub-card-img-box">
          <img src="https://cdn.dhahabi.ae/logo/dhahabi-market-logo-gradient-white.svg" alt="Backoffice Last">
        </div>
        <h3>Backoffice Last</h3>
        <button class="hub-btn">Acceder al Sistema <i data-lucide="arrow-right" style="width:16px;height:16px;"></i></button>
      </a>

      <!-- 3. Gestión de Órdenes -->
      <a href="ordenes.html" class="hub-card">
        <div class="card-badge"><span class="pulse-dot"></span> Activo</div>
        <div class="hub-card-img-box">
          <img src="https://cdn.dhahabi.ae/logo/dhahabi-market-logo-gradient-white.svg" alt="Órdenes">
        </div>
        <h3>Gestión de Órdenes</h3>
        <button class="hub-btn">Acceder al Sistema <i data-lucide="arrow-right" style="width:16px;height:16px;"></i></button>
      </a>

      <!-- 4. Productos Proveedores -->
      <a href="proveedores.html" class="hub-card">
        <div class="card-badge"><span class="pulse-dot"></span> Activo</div>
        <div class="hub-card-img-box">
          <img src="https://cdn.dhahabi.ae/logo/dhahabi-market-logo-gradient-white.svg" alt="Productos Proveedores">
        </div>
        <h3>Productos Proveedores</h3>
        <button class="hub-btn">Acceder al Sistema <i data-lucide="arrow-right" style="width:16px;height:16px;"></i></button>
      </a>
    
    </main>

    <footer class="hub-footer">
      Dhahabi Market © 2026 • Centro de Control de Operaciones
    </footer>

  </div>

  <script>
    const LOGO_DARK = "https://cdn.dhahabi.ae/logo/dhahabi-market-logo-gradient-white.svg";
    const LOGO_LIGHT = "https://cdn.dhahabi.ae/logo/dhahabi-market-logo-gradient.svg";

    function initFloatingLogos() {
      const container = document.getElementById('floatingBg');
      const count = 8;
      for (let i = 0; i < count; i++) {
        const img = document.createElement('img');
        img.src = LOGO_DARK;
        img.className = 'floating-logo';
        
        img.style.top = Math.random() * 80 + 'vh';
        img.style.left = Math.random() * 80 + 'vw';
        
        img.style.animationDuration = (18 + Math.random() * 16) + 's';
        img.style.animationDelay = (Math.random() * -12) + 's';
        
        container.appendChild(img);
      }
    }

    function actualizarLogos(theme) {
      const logoUrl = theme === 'dark' ? LOGO_DARK : LOGO_LIGHT;
      const navLogo = document.getElementById('nav-logo');
      if (navLogo) navLogo.src = logoUrl;
      
      document.querySelectorAll('.floating-logo').forEach(img => {
        img.src = logoUrl;
      });
    }

    function toggleTheme() {
      const current = document.documentElement.getAttribute('data-theme') || 'dark';
      const next = current === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', next);
      localStorage.setItem('dhahabi_hub_theme', next);
      actualizarLogos(next);
    }

    document.addEventListener('DOMContentLoaded', () => {
      const saved = localStorage.getItem('dhahabi_hub_theme') || 'dark';
      document.documentElement.setAttribute('data-theme', saved);
      document.getElementById('theme-toggle-checkbox').checked = (saved === 'dark');
      
      initFloatingLogos();
      actualizarLogos(saved);

      if (window.lucide) lucide.createIcons();
    });
  </script>
</body>
</html>
